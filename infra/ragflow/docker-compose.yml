# RAGFlow 自托管部署（Phase 0 集成验证）
# 基于官方 v0.20.5 的 docker/docker-compose.yml + docker-compose-base.yml 精简：
#   - 只保留 elasticsearch 文档引擎，去掉 opensearch / infinity / sandbox 等 profile；
#   - 端口全部由 .env 控制，默认避开本机已占用的 3000/3001/3002；
#   - 不再 bind mount nginx/entrypoint/service_conf，直接使用镜像内置的同名文件。
# 用法：cd infra/ragflow && cp .env.example .env（改密码）&& docker compose up -d

name: ragflow

services:
  mysql:
    image: mysql:8.0.39
    container_name: ragflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DBNAME}
      TZ: ${TIMEZONE}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - ragflow

  minio:
    image: ${MINIO_IMAGE}
    container_name: ragflow-minio
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      TZ: ${TIMEZONE}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ragflow

  redis:
    image: valkey/valkey:8
    container_name: ragflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - ragflow

  es01:
    image: elasticsearch:${STACK_VERSION}
    container_name: ragflow-es-01
    restart: unless-stopped
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT}:9200"
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE ''"status":"(green|yellow)"'''
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks:
      - ragflow

  ragflow:
    image: ${RAGFLOW_IMAGE}
    container_name: ragflow-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_started
    env_file: .env
    environment:
      - TZ=${TIMEZONE}
      - DOC_ENGINE=elasticsearch
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "${SVR_HTTP_PORT}:9380"   # HTTP API
      - "${SVR_WEB_PORT}:80"      # Web UI（容器内 nginx）
    volumes:
      - ragflow-logs:/ragflow/logs
    healthcheck:
      # 镜像内没有内置 healthcheck；用 Python 探 9380（/v1/system/version 需要登录）
      test:
        - CMD-SHELL
        - 'python3 -c "import socket; socket.create_connection((''127.0.0.1'', 9380), 3)"'
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ragflow

volumes:
  mysql_data:
  minio_data:
  redis_data:
  esdata01:
  ragflow-logs:

networks:
  ragflow:
    driver: bridge
